// Wire contract between the C++ backend and the TypeScript frontend.
// Compiled with protoc (C++) and protoc-gen-es (TypeScript).
//
// Design notes, because several choices here are deliberate and not obvious:
//
//   * Prices and quantities are integers scaled by a power of ten, exactly as
//     in the .bin recordings (see l2::FileHeader). The scale arrives once per
//     stream in StreamInfo. Sending doubles instead would discard the exact
//     decimal text the venue sent, which the whole fixed-point path exists to
//     preserve.
//   * A websocket frame is already length delimited, so one message per frame
//     needs no framing of its own. This is why proto suits the wire but not
//     the recordings, where framing would have to be hand rolled anyway.
//   * Timestamps are sfixed64, not int64. Nanoseconds since the epoch are
//     around 1.8e18, so every varint would spend 9 to 10 bytes; sfixed64 is
//     always 8.
//   * Book messages carry a numeric stream_id rather than a symbol string, so
//     a high rate stream does not repeat "BTC/USD" on every update. The
//     mapping arrives in StreamInfo.
//   * Anything the backend can replay from a .bin must be expressible here,
//     so the frontend cannot tell a live feed from a replay. That is why the
//     venue checksum and both timestamps are on the wire too.
//   * A book's stream_id is the id of the subscription it belongs to, so the
//     id a client gets back from Start is the one it watches and stops.
//   * The command and its reply are ClientCommand and CommandResult rather
//     than Request and Response, which would shadow the fetch API's globals
//     of the same names in the generated TypeScript.

syntax = "proto3";

package trading.market_data.v1;

// ---------------------------------------------------------------------------
// Shared
// ---------------------------------------------------------------------------

// The venues the backend streams from.
enum Venue {
  VENUE_UNSPECIFIED = 0;
  VENUE_KRAKEN = 1;
}

// What a subscription does with its book.
enum Sink {
  SINK_UNSPECIFIED = 0;
  // Shown to a client.
  SINK_LIVE = 1;
  // Recorded to a .bin on the backend.
  SINK_RECORD = 2;
}

// ---------------------------------------------------------------------------
// Server to client
// ---------------------------------------------------------------------------

// One price level. Both fields are integers scaled by the decimals in the
// StreamInfo for this stream: price / 10^price_decimals is the real price.
// Within a Book of kind DELTA, a quantity of zero means the level is gone.
message Level {
  sint64 price = 1;
  sint64 quantity = 2;
}

// Establishes what a stream_id means and how to decode its numbers. Sent
// before any Book for that stream, and again on reconnect. A client that
// receives a Book for an unknown stream_id must drop it rather than guess a
// scale.
message StreamInfo {
  uint64 stream_id = 1;
  string symbol = 2;
  string venue = 3;
  // Book depth subscribed to at the venue.
  uint32 depth = 4;
  uint32 price_decimals = 5;
  uint32 qty_decimals = 6;
}

// Book state for one stream.
//
// Snapshot and delta are one message rather than two, because they carry
// identical fields and the recordings already model the distinction as an
// enum. Re-broadcasting a recorded message is then a field copy with no
// branching, and a new field cannot be added to one and forgotten on the
// other.
message Book {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Replaces everything the client holds for this stream.
    KIND_SNAPSHOT = 1;
    // Changed levels only; apply in arrival order.
    KIND_DELTA = 2;
  }

  uint64 stream_id = 1;
  Kind kind = 2;
  // Best first.
  repeated Level bids = 3;
  repeated Level asks = 4;
  // The venue's CRC32 over the book this message leaves behind, so a client
  // can prove it applied the deltas correctly. Zero if the venue omitted it.
  fixed32 checksum = 5;
  // The venue's own timestamp, nanoseconds since the Unix epoch.
  sfixed64 venue_time_ns = 6;
  // When the backend read the frame off the venue socket. Subtracting the
  // venue time gives the transport delay.
  sfixed64 capture_time_ns = 7;
}

// Health of the backend's connection to the venue, so the frontend can
// distinguish a quiet market from a broken feed, and can show a pair that was
// dropped because its writer lane failed.
//
// Sent to the watchers of a stream when a gap opens in it: DISCONNECTED when
// the venue connection dropped, DEGRADED when the pair is being resubscribed
// because its book stopped matching the venue's checksum. Either way, drop
// the book; a snapshot ends the gap, and LIVE, naming the stream, comes just
// before it.
message FeedStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_CONNECTING = 1;
    STATE_LIVE = 2;
    // Connected, but at least one subscribed pair is not flowing.
    STATE_DEGRADED = 3;
    STATE_DISCONNECTED = 4;
  }

  State state = 1;
  // Free text for the UI; never parsed.
  string detail = 2;
  // Streams currently subscribed and healthy.
  repeated uint64 healthy_stream_ids = 3;
}

// Sent when nothing else has gone out recently, so a client can tell an idle
// market from a dead socket. Empty: the envelope already carries the time.
message Heartbeat {}

// Every frame the backend pushes. New event kinds extend the oneof.
message MarketDataEvent {
  // Increments by one per frame per connection, so a client can detect that
  // it missed something and Watch again for a fresh snapshot.
  uint64 sequence = 1;
  // When the backend put this frame on the wire, nanoseconds since the Unix
  // epoch. Against capture_time_ns this gives the backend's internal delay.
  sfixed64 send_time_ns = 2;

  oneof payload {
    StreamInfo stream_info = 3;
    Book book = 4;
    FeedStatus feed_status = 5;
    Heartbeat heartbeat = 6;
    CommandResult result = 7;
  }
}

// One subscription, live or recording, as listed to a client.
message Subscription {
  // Unique across venues; also the stream_id of its books.
  uint64 id = 1;
  Venue venue = 2;
  string symbol = 3;
  // Book depth subscribed to at the venue.
  uint32 depth = 4;
  Sink sink = 5;
  // When it started, nanoseconds since the Unix epoch.
  sfixed64 start_time_ns = 6;
}

message SubscriptionList {
  // Every subscription on the backend; the client filters by sink.
  repeated Subscription subscriptions = 1;
}

// One pair a venue can stream. A message rather than a bare string, so that
// more about a pair can be added without breaking clients.
message Pair {
  // E.g. "BTC/USD"; what Start takes.
  string symbol = 1;
}

// What a venue can stream: its pairs, and the book depths it accepts.
message PairList {
  // Sorted by symbol.
  repeated Pair pairs = 1;
  // Ascending.
  repeated uint32 depths = 2;
}

// Why a command failed.
message CommandError {
  enum Code {
    CODE_UNSPECIFIED = 0;
    // Malformed, or a command the backend does not know.
    CODE_INVALID_COMMAND = 1;
    // Not a depth the venue accepts.
    CODE_INVALID_DEPTH = 2;
    // The venue does not list the symbol.
    CODE_UNKNOWN_SYMBOL = 3;
    // No subscription has the id.
    CODE_UNKNOWN_ID = 4;
    // The subscription exists, but with another sink than the command named.
    CODE_SINK_MISMATCH = 5;
    // The pair already has a subscription; a pair has at most one.
    CODE_SYMBOL_IN_USE = 6;
    // The backend's connection to the venue failed.
    CODE_VENUE_FAILED = 7;
    // The backend has handed out every subscription id it can.
    CODE_IDS_EXHAUSTED = 8;
  }

  Code code = 1;
  // Free text for the UI; never parsed.
  string detail = 2;
}

// Empty: the command succeeded and has nothing to return.
message Ok {}

// The reply to one ClientCommand.
message CommandResult {
  // The ClientCommand's request_id.
  uint64 request_id = 1;

  oneof result {
    // Start: the new subscription's id, or an existing recording's when the
    // pair is already recorded at the same depth.
    uint64 started_id = 2;
    // Stop, Watch, Unwatch.
    Ok ok = 3;
    // List.
    SubscriptionList subscriptions = 4;
    // Any command.
    CommandError error = 5;
    // ListPairs.
    PairList pairs = 6;
  }
}

// ---------------------------------------------------------------------------
// Client to server
// ---------------------------------------------------------------------------

// Starts streaming a pair to a new subscription. Replied to with its id.
message Start {
  Venue venue = 1;
  // E.g. "BTC/USD".
  string symbol = 2;
  // Must be one the venue accepts (kraken::kL2Depths).
  uint32 depth = 3;
  Sink sink = 4;
}

// Ends a subscription. The sink must match the subscription's, so a command
// meant for a recording cannot stop a live feed.
message Stop {
  uint64 id = 1;
  Sink sink = 2;
}

// Lists every subscription.
message List {}

// Streams a live subscription's books to this client: a StreamInfo, a
// snapshot, then updates. Replaces any subscription watched before.
message Watch {
  uint64 id = 1;
}

// Stops streaming books to this client.
message Unwatch {}

// Lists the pairs a venue can stream, so a client can pick one to Start.
message ListPairs {
  Venue venue = 1;
}

// Every frame a client sends.
message ClientCommand {
  // Chosen by the client and echoed in the CommandResult.
  uint64 request_id = 1;

  oneof command {
    Start start = 2;
    Stop stop = 3;
    List list = 4;
    Watch watch = 5;
    Unwatch unwatch = 6;
    // Past the fields reserved below.
    ListPairs list_pairs = 16;
  }

  // Playback: ListRecordings, Play, PlaybackNext, StopPlayback.
  reserved 7 to 15;
}
